name: daily-news
on:
  schedule:
    - cron: "7,37 * * * *"   # 每小时第7、37分钟各更新一次=每30分钟(避开整点拥堵;GitHub 偶尔会延迟几分钟)
  workflow_dispatch:          # 也可以手动点击运行
concurrency:
  group: news
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
      - name: Publish (keep repo history tiny)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin snapshot:main
