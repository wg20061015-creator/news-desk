  return fetch("data.json?t="+Date.now(),{cache:"no-store",signal:tmo(10000)}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    LIVE.sync=Date.now();LIVE.chk=fmtT(Date.now()).slice(6);
    if(!j||!j.items||(j.built||0)<=(D.built||0)){LIVE.cloud="same";status();return}
    LIVE.cloud="new";
    ["updated","items","market","cal","kimchi","built","health","kw","impact","feeds","targets","krlink","alertre","officialre"].forEach(function(k){if(j[k]!==undefined)D[k]=j[k]});
    KWR=null;IMR=null;rerender();
  }).catch(function(){LIVE.cloud="fail";status()});
}
function liveRefresh(force){
  if(LIVE.busy)return;
  if(!force&&LIVE.off){status();liveMarket(false);return}
  if(!force&&Date.now()-LIVE.last<5*60*1000)return;
  LIVE.busy=true;LIVE.state="go";LIVE.ok=0;LIVE.added=0;
  var feeds=(D.feeds||[]).slice();LIVE.total=feeds.length;status();
  var seen={};D.items.forEach(function(n){seen[nkey(n.o||n.zh.h)]=1;seen[nkey(n.ko.h)]=1;seen[nkey(n.zh.h)]=1});
  var now=Date.now();
  function add(f,list){
    var c=0;
    list.forEach(function(e){if(e.ts>now+6e5){e.ts-=324e5;if(e.ts>now+6e5)e.ts=now}});
    list.sort(function(a,b){return b.ts-a.ts});
    list.forEach(function(e){
      if(c>=f.cap||!e.title||now-e.ts>f.h*36e5)return;
      var src=f.src||e.src||f.tag,title=e.title;
      if(!f.src&&e.src&&title.slice(-(e.src.length+3))===" - "+e.src)title=title.slice(0,-(e.src.length+3));
      var k=nkey(title);if(!k||seen[k])return;seen[k]=1;c++;
      var gn=f.u.indexOf("news.google.com")>=0,desc=gn?"":e.desc.slice(0,240);
      var s=score(title+" "+desc,f.k,(now-e.ts)/36e5);
      var link=/^https?:/.test(e.link)?e.link:"#";
      var KLR=D.krlink?new RegExp(D.krlink,"i"):null,ALR=D.alertre?new RegExp(D.alertre,"i"):null,OFR=D.officialre?new RegExp(D.officialre,"i"):null;
      D.items.push({live:1,of:(OFR&&OFR.test(src))?1:0,kl:(KLR&&f.k!=="k"&&KLR.test(title))?1:0,al:(ALR&&ALR.test(title))?1:0,o:title,ts:e.ts,sc:s.sc,imp:s.imp,k:f.k,tag:f.tag,src:src,url:link,t:fmtT(e.ts),
        zh:{h:title,b:desc},ko:{h:title,b:desc}});
      LIVE.added++;
    });
  }
  function worker(){
    var f=feeds.shift();if(!f)return Promise.resolve();
    return getFeed(f).then(function(l){add(f,l);LIVE.ok++}).catch(function(){}).then(function(){status();return worker()});
  }
  Promise.all([worker(),worker(),worker()]).then(function(){
    var lim={us:70,g:40,geo:30,v:60,k:100,c:40},cnt={};
    D.items.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
    D.items=D.items.filter(function(n){cnt[n.k]=(cnt[n.k]||0)+1;return cnt[n.k]<=(lim[n.k]||40)});
    LIVE.last=Date.now();LIVE.state=LIVE.ok?"ok":"fail";LIVE.busy=false;
    try{if(LIVE.ok){localStorage.removeItem("livefail");LIVE.off=false}else{localStorage.setItem("livefail",Date.now());LIVE.off=true}}catch(e){}LIVE.chk=fmtT(Date.now()).slice(6);
    rerender();liveMarket(true);
  });
}
function liveMarket(force){
  if(!force&&Date.now()-LIVE.mk<120000)return;
  LIVE.mk=Date.now();
  var q=(D.market||[]).slice();LIVE.mq=0;LIVE.mqT=q.length;
  function w(){
    var r=q.shift();if(!r)return Promise.resolve();
    var url="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(r.s)+"?interval=1d&range=5d";
    return getText(url,true,false).then(function(tx){
      var j=JSON.parse(tx).chart.result[0],m=j.meta;
      var cl=j.indicators.quote[0].close.filter(function(c){return c!=null});
      var p=m.regularMarketPrice||cl[cl.length-1],pv=cl.length>=2?cl[cl.length-2]:m.chartPreviousClose;
      LIVE.mq++;r.p=p;r.c=p-pv;r.pc=pv?(p-pv)/pv*100:0;r.t=fmtT(m.regularMarketTime*1000);
    }).catch(function(){}).then(w);
  }
  Promise.all([w(),w(),w(),w()]).then(function(){
    getText("https://api.upbit.com/v1/ticker?markets=KRW-BTC",true,false).then(function(tx){
      var up=JSON.parse(tx)[0],b=mrow("BTC-USD"),f=mrow("KRW=X");
      if(up&&b&&f)D.kimchi={btc_krw:up.trade_price,pc:up.signed_change_rate*100,premium:(up.trade_price/(b.p*f.p)-1)*100};
    }).catch(function(){}).then(rerender);
  });
}
function nurl(n){return /^https?:/.test(n.url||"")?n.url:"#"}
function alertBox(){
  var now=Date.now(),al=D.items.filter(function(n){return n.al&&n.ts&&now-n.ts<24*36e5}).slice(0,3);
  if(!al.length)return null;
  var box=el("div","alert2");
  box.appendChild(el("div","",lang==="zh"?"🚨 市场警报(熔断 / 暂停交易 / 违约 / 挤兑等关键词)":"🚨 시장 경보 (서킷브레이커·거래정지·부도·뱅크런 등)"));
  al.forEach(function(n){var a=el("a","",n[lang].h);fix(a,n[lang].h);a.href=nurl(n);a.target="_blank";a.rel="noopener";box.appendChild(a)});
  return box;
}
function tgtBox(){
  var box=document.createElement("div");
  box.appendChild(el("h2","",lang==="zh"?"🎯 策略师目标价速览(从标题自动提取,仅供参考)":"🎯 전략가 목표치 요약 (제목에서 자동 추출, 참고용)"));
  var c=el("div","card");
  (D.targets||[]).slice(0,10).forEach(function(t){
    var r=el("div","ev"),d=el("span","dd",t.idx+" "+fmt(t.num,0));d.style.minWidth="132px";r.appendChild(d);
    var w=el("div"),a=el("a","",t[lang].h);fix(a,t[lang].h);a.href=/^https?:/.test(t.url||"")?t.url:"#";a.target="_blank";a.rel="noopener";w.appendChild(a);
    w.appendChild(el("div","w",t.who+" · "+t.t+" · "+t.src));r.appendChild(w);c.appendChild(r)});
  box.appendChild(c);return box;
}
function render(){
  var u=UI[lang];document.documentElement.lang=lang;
  $("title").textContent=u.title;$("sub").textContent=u.sub+D.updated;$("note").textContent=u.note;$("q").placeholder=u.ph;
  var counts={a:0};D.items.forEach(function(n){counts[n.k]=(counts[n.k]||0)+1;if(n.k!=="c"||cryptoOn)counts.a++});
  seg($("tabs"),["a","m","us","k","c","g","geo","v"].map(function(k){return [k,u.tabs[k]+(k==="m"?"":" "+(counts[k]||0))]}),tab,function(v){tab=v;render()});
  seg($("langs"),[["zh","中文"],["ko","한국어"]],lang,function(v){lang=v;try{localStorage.setItem("lang",v)}catch(e){}render()});
  seg($("sorts"),[["t",lang==="zh"?"🕒 最新":"🕒 최신"],["s",lang==="zh"?"⚡ 重要":"⚡ 중요"]],sortMode,function(v){sortMode=v;render()});
  var top=$("top");top.innerHTML="";var box=$("list");box.innerHTML="";
  $("q").style.display=tab==="m"?"none":"";$("chips").style.display=tab==="m"?"none":"flex";$("sorts").style.display=tab==="m"?"none":"";
  chipsRender();status();
  if(tab==="m"){top.appendChild(mktBox(true));top.appendChild(calBox(30));return}
  if(tab==="v"&&!kw&&!imf&&!onlyHot&&!klOnly&&(D.targets||[]).length)top.appendChild(tgtBox());
  var list=D.items.filter(match),tp=[];
  if(tab==="a"&&!kw&&!imf&&!onlyHot&&!klOnly&&!ofOnly){
    var ab=alertBox();if(ab)top.appendChild(ab);
    top.appendChild(mktBox(false));top.appendChild(calBox(4));
    tp=D.items.filter(inTab).sort(function(a,b){return b.sc-a.sc}).slice(0,8);
    if(tp.length){top.appendChild(el("h2","",u.top));tp.forEach(function(n){top.appendChild(card(n))});
      top.appendChild(el("h2","",(sortMode==="s"?{zh:"⚡ 其余(按重要度)",ko:"⚡ 나머지(중요도순)"}:{zh:"🕒 最新",ko:"🕒 최신"})[lang]))}
  }
  if(tp.length)list=list.filter(function(n){return tp.indexOf(n)<0});
  if(sortMode==="s")list.sort(function(a,b){return (b.sc-a.sc)||((b.ts||0)-(a.ts||0))});
  if(!list.length&&!tp.length){box.appendChild(el("div","empty",u.empty));return}
  list.forEach(function(n){box.appendChild(card(n))});
}
$("q").oninput=function(){kw=this.value.trim().toLowerCase();render()};
render();
syncCloud().then(function(){liveRefresh(false)});
setInterval(function(){if(document.visibilityState==="visible")syncCloud().then(function(){liveRefresh(false)})},5*60*1000);
setInterval(function(){var s=$("sess");if(s)s.textContent=sessText()},30000);
function saveSeen(){try{var m=0;D.items.forEach(function(n){if(n.ts>m)m=n.ts});if(m){localStorage.setItem("lastseen",m);LASTNEXT=m}}catch(e){}}
window.addEventListener("pagehide",saveSeen);
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){saveSeen();return}
  if(LASTNEXT)LAST=LASTNEXT;
  syncCloud().then(function(){liveRefresh(false)});
});
</script>
